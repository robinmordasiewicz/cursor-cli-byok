name: Fork CI

on:
  push:
    branches: [build-internal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
          - os: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            target: darwin-amd64
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packaging/go-version.txt
          cache: true
      - name: Verify source
        run: make fmt-check test vet shell-test
      - name: Verify release script failure boundaries
        run: python3 -m unittest discover -s test/packaging -v
      - name: Build independent fork artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 make build VERSION="dev.$SOURCE_SHA"
          mkdir -p artifacts
          cp dist/cursor-cli-byok "artifacts/cursor-cli-byok-$TARGET"
          python3 scripts/artifact-receipt.py "artifacts/cursor-cli-byok-$TARGET" "$SOURCE_SHA" "$TARGET"
      - name: Upload unsigned development artifact and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
